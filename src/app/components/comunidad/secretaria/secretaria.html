<div class="card">
    <img src="assets/images/comunidad/comunidad-secretaria.jpg" alt="Secretaria">
    <div class="card-info">
      <h3>Secretaria</h3>
      <ul class="card-menu">
        <li (click)="modalActivo = 'bautismos'">
          <i class="fa-solid fa-chevron-right"></i> Requisitos para Bautismos
        </li>
        <li (click)="modalActivo = 'catequesis'">
          <i class="fa-solid fa-chevron-right"></i> Catequesis de niños
        </li>
        <li (click)="modalActivo = 'casamientos'">
          <i class="fa-solid fa-chevron-right"></i> Requisitos para Casamientos
        </li>
        <li (click)="modalActivo = 'misa'">
          <i class="fa-solid fa-chevron-right"></i> Información de Misas y Confesiones
        </li>
        <li (click)="modalActivo = 'santeria'">
          <i class="fa-solid fa-chevron-right"></i> Santeria
        </li>
      </ul>

     <app-whatsapp></app-whatsapp> 
    </div>
  </div>


  <app-req-bautismos *ngIf="modalActivo === 'bautismos'" (close)="modalActivo = null"></app-req-bautismos>
  <app-req-catequesis *ngIf="modalActivo === 'catequesis'" (close)="modalActivo = null"></app-req-catequesis>
  <app-req-casamientos *ngIf="modalActivo === 'casamientos'" (close)="modalActivo = null"></app-req-casamientos>
  <app-info-misas *ngIf="modalActivo === 'misa'" (close)="modalActivo = null"></app-info-misas>
  <app-santeria *ngIf="modalActivo === 'santeria'" (close)="modalActivo = null"> </app-santeria>
