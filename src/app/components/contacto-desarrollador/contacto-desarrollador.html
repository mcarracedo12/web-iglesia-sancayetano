<div class="dev-credit-container">
    <!-- <span>Desarrollo Web — </span> -->
    <button class="dev-link" (click)="abrirModal()">Contacto Desarrollador</button>
  </div>
<!-- Modal de Contacto -->
<div class="modal-overlay" *ngIf="isModalOpen" (click)="cerrarModal()">
  <div class="document-page dev-modal" (click)="$event.stopPropagation()">
    <button type="button" class="close-btn" (click)="cerrarModal()">&times;</button>

    <div class="content">
      <h2>Contacto Desarrollador</h2>
      <p class="subtitle">¿Detectaste algún error técnico o tenés una consulta sobre el sitio?</p>

      <form (submit)="enviarFormulario($event)" class="dev-form">

        <input type="text" name="_gotcha" [(ngModel)]="formData._gotcha" style="display:none !important;" tabindex="-1" autocomplete="off">

        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="name" [(ngModel)]="formData.name" required placeholder="Tu nombre">
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" [(ngModel)]="formData.email" required placeholder="tu@email.com">
        </div>

        <div class="form-group">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="message" [(ngModel)]="formData.message" rows="4" required placeholder="Escribí tu mensaje acá..."></textarea>
        </div>

        <button type="submit" class="btn-submit" [disabled]="enviando">
          {{ enviando ? 'Enviando...' : 'Enviar Mensaje' }}
        </button>

        <p class="status-msg success" *ngIf="mensajeExito">¡Mensaje enviado con éxito! Nos pondremos en contacto pronto.</p>
        <p class="status-msg error" *ngIf="mensajeError">Ocurrió un error al enviar. Por favor intentá más tarde.</p>
      </form>
    </div>
  </div>
</div>
